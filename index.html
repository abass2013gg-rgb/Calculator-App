<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="author" content="abass">
    <meta name="description" content="I'm Learn Java Script">
    <title>Document</title>
    <link rel="stylesheet" href="/JavaScript/style.css">
</head>

<body>
    <div class="con">
        <section class="input">
            0
        </section>
        <div class="box">
            <div class="button">
                <button onclick="clearDisplay()">AC</button>
                <button onclick="deleteLast()">DEL</button>
                <button id="opt" onclick="appendToDisplay('%')">%</button>
                <button id="opt" onclick="appendToDisplay('/')">/</button>
            </div>
            <div class="button">
                <button onclick="appendToDisplay('7')">7</button>
                <button onclick="appendToDisplay('8')">8</button>
                <button onclick="appendToDisplay('9')">9</button>
                <button id="opt" onclick="appendToDisplay('*')">*</button>
            </div>
            <div class="button">
                <button onclick="appendToDisplay('4')">4</button>
                <button onclick="appendToDisplay('5')">5</button>
                <button onclick="appendToDisplay('6')">6</button>
                <button id="opt" onclick="appendToDisplay('-')">-</button>
            </div>
            <div class="button">
                <button onclick="appendToDisplay('1')">1</button>
                <button onclick="appendToDisplay('2')">2</button>
                <button onclick="appendToDisplay('3')">3</button>
                <button id="opt" onclick="appendToDisplay('+')">+</button>
            </div>
            <div class="button">
                <button onclick="appendToDisplay('00')">00</button>
                <button onclick="appendToDisplay('0')">0</button>
                <button onclick="appendToDisplay('.')">.</button>
                <button id="opt" onclick="calculate()">=</button>
            </div>
        </div>
    </div>
    <script src="/JavaScript/script.js"></script>
</body>

</html>
